<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">
            <a href="#">Race Minds-F1</a>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>


    <div id="Formula">
        <h1 id="f1">Formula 1</h1>
    </div>

    <h2 id="track"></h2>

    <div id="race_container"> </div>

    
    <h1 id="user">RaceMinds</h1>


    <form id="formm">
    <div class="Racemind">

    <div id="q1">
  <h3>1. Select the Pit lap:</h3>
  
  <p>
  <input type="radio" id="Lap_25" name="pit_lap" value="Lap_25">
  <label for="Lap_25">Lap 25</label>
    </p>

    <p>
  <input type="radio" id="Lap_30" name="pit_lap" value="Lap_30">
  <label for="Lap_30">Lap 30</label>
    </p>

    <p>
  <input type="radio" id="lap_35" name="pit_lap" value="lap_35">
  <label for="Lap_35">Lap 35</label>
    </p>
    </div>


    <div id="q2">
  <h3>2. Tire Compound:</h3>
  
  <p>
  <input type="radio" id="soft" name="tire" value="soft">
  <label for="soft">Soft</label>
    </p>

    <p>
  <input type="radio" id="medium" name="tire" value="medium">
  <label for="medium">Medium</label>
    </p>

    <p>
  <input type="radio" id="hard" name="tire" value="hard">
  <label for="hard">Hard</label>
    </p>
    </div>

    <div id="q3">
  <h3>3. Driving Style:</h3>
  
  <p>
  <input type="radio" id="agressive" name="drive" value="agressive">
  <label for="agressive">Agressive</label>
    </p>

    <p>
  <input type="radio" id="balanced" name="drive" value="balanced">
  <label for="balanced">Balanced</label>
    </p>

    <p>
  <input type="radio" id="conservative" name="drive" value="conservative">
  <label for="conservative">Conservative</label><br><br>
    </p>
    </div>


    <div id="q4">
  <h3>4.  When should the driver attack:</h3>
  
  <p>
  <input type="radio" id="agressive" name="attack" value="Attack">
  <label for="Attack">Attack Immediately</label>
    </p>

    <p>
  <input type="radio" id="balanced" name="attack" value="wait">
  <label for="wait">Wait for DRS</label>
    </p>

    <p>
  <input type="radio" id="conservative" name="attack" value="stay">
  <label for="stay">Stay Behind and Save Tires</label><br><br>
    </p>
    </div>


    </div>

        <button type="submit" id="btn">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
