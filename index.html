<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="Formula">
        <h1 id="f1">Formula 1</h1>
    </div>

    <h2 id="track"></h2>
    <div id="race_container">
        
    </div>

    <div>
        <form id="formm">
  <p>Select the pit_lap:</p>
  
  <input type="radio" id="Lap_25" name="pit_lap" value="Lap_25">
  <label for="Lap_25">Lap 25</label>

  <input type="radio" id="Lap_30" name="pit_lap" value="Lap_30">
  <label for="Lap_30">Lap 30</label>

  <input type="radio" id="lap_35" name="pit_lap" value="lap_35">
  <label for="Lap_35">Lap 35</label>


  <p>Tire Compound:</p>
  
  <input type="radio" id="soft" name="tire" value="soft">
  <label for="soft">Soft</label>

  <input type="radio" id="medium" name="tire" value="medium">
  <label for="medium">Medium</label>

  <input type="radio" id="hard" name="tire" value="hard">
  <label for="hard">Hard</label>


  <p>Driving Style:</p>
  
  <input type="radio" id="agressive" name="drive" value="agressive">
  <label for="agressive">Agressive</label>

  <input type="radio" id="balanced" name="drive" value="balanced">
  <label for="balanced">Balanced</label>

  <input type="radio" id="conservative" name="drive" value="conservative">
  <label for="conservative">Conservative</label><br><br>


        <button type="submit" id="btn">Submit</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
